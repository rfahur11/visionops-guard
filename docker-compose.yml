version: "3.8"

services:
  visionops-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visionops-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  visionops-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visionops-ui
    command: streamlit run ui/app.py --server.port=8501 --server.address=0.0.0.0
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - visionops-api
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: visionops-prometheus
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped
