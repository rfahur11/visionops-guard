name: VisionOps CI/CD & Automated Hugging Face Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-and-test:
    name: 🧪 Automated Test & QA Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code (with Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless pillow pyyaml pandas onnx onnxruntime pydantic fastapi httpx pytest requests python-multipart prometheus-fastapi-instrumentator ultralytics

      - name: Run Data QA Integrity Check
        run: |
          python src/data/download_dataset.py
          python src/data/data_validation.py

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/ -v

  deploy-to-huggingface:
    name: 🤗 Auto Deploy to Hugging Face Spaces
    needs: validate-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository (Full History & Git LFS)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Configure Git LFS & Deploy to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is not set in GitHub Repository Secrets!"
            exit 1
          fi
          git lfs install
          echo "Pushing mirror to Hugging Face Space..."
          git push --force https://rfahrur6045:$HF_TOKEN@huggingface.co/spaces/rfahrur6045/mlops-final-copy main
          echo "Successfully deployed to Hugging Face Spaces!"
