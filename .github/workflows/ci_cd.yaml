name: VisionOps CI/CD & Automated Hugging Face Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    name: 🧪 Automated Test & QA Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless pillow pyyaml pandas onnx onnxruntime pydantic fastapi httpx pytest

      - name: Run Data QA Integrity Check
        run: |
          python src/data/download_dataset.py
          python src/data/data_validation.py

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v

  deploy-to-huggingface:
    name: 🤗 Auto Deploy to Hugging Face Spaces
    needs: validate-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            git push --force https://rfahrur6045:$HF_TOKEN@huggingface.co/spaces/rfahrur6045/mlops-final-copy main
            echo "Successfully deployed to Hugging Face Space!"
          else
            echo "HF_TOKEN secret is not set in GitHub Repository Secrets. Skipping auto-deploy."
          fi
