project:
  name: "VisionOps Guard"
  version: "1.0.0"
  description: "Real-Time Industrial Safety PPE Detection & CVOps Pipeline"

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  dataset_yaml: "data/dataset.yaml"
  img_size: 640
  valid_extensions: [".jpg", ".jpeg", ".png"]
  classes:
    0: "helmet"
    1: "gloves"
    2: "vest"
    3: "boots"
    4: "goggles"
    5: "none"
    6: "person"
    7: "no_helmet"
    8: "no_goggles"
    9: "no_gloves"
    10: "no_boots"
  class_colors:
    helmet: "#10B981"      # Emerald Green
    gloves: "#8B5CF6"      # Purple
    vest: "#06B6D4"        # Cyan
    boots: "#F59E0B"       # Amber
    goggles: "#3B82F6"     # Blue
    none: "#9CA3AF"        # Gray
    person: "#3B82F6"      # Blue
    no_helmet: "#EF4444"   # Red Alert
    no_goggles: "#EF4444"  # Red Alert
    no_gloves: "#EF4444"   # Red Alert
    no_boots: "#EF4444"    # Red Alert

augmentation:
  horizontal_flip_p: 0.5
  random_brightness_contrast_p: 0.3
  motion_blur_p: 0.2
  shift_scale_rotate_p: 0.3

model:
  architecture: "yolov8n"  # Lightweight nano backbone for high FPS / low latency
  epochs: 15
  batch_size: 16
  learning_rate: 0.01
  onnx_export_path: "models/visionops_guard.onnx"
  quantization: "FP16"

inference:
  conf_threshold: 0.45
  iou_threshold: 0.45
  max_detections: 100
  target_latency_ms: 35.0

monitoring:
  drift_reference_path: "data/processed/reference_features.csv"
  drift_threshold: 0.05
  alert_webhook_url: ""
