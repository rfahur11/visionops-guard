stages:
  acquire_data:
    cmd: python src/data/download_dataset.py
    deps:
      - src/data/download_dataset.py
    outs:
      - data/raw

  validate_data_qa:
    cmd: python src/data/data_validation.py
    deps:
      - data/raw
      - src/data/data_validation.py
      - config/model_config.yaml
    outs:
      - data/qa_report.json

  preprocess_and_augment:
    cmd: python src/data/preprocess.py
    deps:
      - data/raw
      - src/data/preprocess.py
      - config/model_config.yaml
    outs:
      - data/processed

  train_yolo_model:
    cmd: python src/models/train.py
    deps:
      - data/processed
      - src/models/train.py
      - config/model_config.yaml
    outs:
      - models/best_model.pt

  convert_and_benchmark_onnx:
    cmd: python src/models/convert_onnx.py
    deps:
      - models/best_model.pt
      - src/models/convert_onnx.py
      - config/model_config.yaml
    outs:
      - models/visionops_guard.onnx
      - data/latency_benchmark.json
